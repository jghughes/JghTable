<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DIRT 13</title>
    <!-- AG Grid CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ag-grid-community@29.3.4/styles/ag-grid.css"
    />

      rel="stylesheet"

    <link rel="stylesheet" href="../shared-mastercopies/base-grid.css" />

    <div class="document-container">
      <h1>DIRT Racing Series Round 13</h1>

        <select id="raceSelector"></select>

    </div>
    <!-- AG Grid JS -->
